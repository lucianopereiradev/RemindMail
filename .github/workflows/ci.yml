name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Guardar package-lock.json gerado
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json

  edge-function:
    name: Edge Function (checagem de tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: deno check supabase/functions/send-reminders/index.ts
