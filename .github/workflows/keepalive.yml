name: Manter Supabase ativo

# O plano gratuito do Supabase pausa projetos com pouca atividade.
# Este ping diário faz uma chamada leve ao banco para evitar isso.
on:
  schedule:
    - cron: "17 12 * * *" # todo dia às 09:17 (horário de Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco
        env:
          SUPABASE_URL: https://vnluhspaxiujfyxqiyfe.supabase.co
          # Chave publishable: é pública (a mesma usada no navegador)
          SUPABASE_KEY: sb_publishable_8ko5kfEmeq5FYUWYusiGQg_85NZO2cu
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = "200"
